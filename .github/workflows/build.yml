# Compile l'installeur Windows et l'image disque macOS.
# Lancement manuel (onglet Actions) ou à chaque tag vX.Y.Z, qui joint alors les fichiers à la Release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Certificat de signature (secrets MACOS_CERT_P12 en base64 et MACOS_CERT_PASSWORD) : une
      # signature stable garde l'autorisation d'enregistrer l'écran d'une version à l'autre.
      # Sans ces secrets, la signature est ad hoc.
      - name: Importer le certificat de signature
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "Pas de certificat : signature ad hoc."; exit 0; fi
          KC="$RUNNER_TEMP/signature.keychain-db"
          KCPASS=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -p codesigning "$KC" | awk -F'"' '/"/ {print $2; exit}')
          echo "Identité : $IDENTITY"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Compiler l'application et le .dmg
        run: ./build-macos.sh
      - uses: actions/upload-artifact@v5
        with:
          name: ScreenCapture-macOS
          path: dist/*.dmg
      - name: Joindre à la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ScreenCapture ${GITHUB_REF_NAME#v}" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compiler l'installeur
        shell: pwsh
        run: ./build-installer.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: ScreenCapture-Windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Joindre à la Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ScreenCapture ${GITHUB_REF_NAME#v}" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*-portable.zip --clobber

[package]
name = "screencapture"
version = "0.1.13"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Stéphane Salou"]
description = "Outil de capture d'écran et d'annotation en Rust avec un design Material 3 (Windows et macOS)"

[[bin]]
name = "ScreenCapture"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
egui_material_icons = "0.3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
tiny-skia = "0.11.4"
ab_glyph = "0.2.29"
arboard = "3.4"
global-hotkey = "0.6.4"
tray-icon = "0.19.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
anyhow = "1"
raw-window-handle = "0.6"
sys-locale = "0.3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Win32_Devices_FunctionDiscovery",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# macOS : mêmes versions que winit / tray-icon pour éviter les doublons.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSGeometry", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSGraphics"] }
objc2-vision = { version = "0.2", features = ["VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
